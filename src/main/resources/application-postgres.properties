# Configurações do Profile 'postgres' (Para conexão com PostgreSQL Local e pgAdmin)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/integrados_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway Migrations no PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=public

# Hibernate Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
