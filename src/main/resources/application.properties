spring.application.name=integrados

# Configuração do H2 em memória
spring.datasource.url=jdbc:h2:mem:integradosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza o schema automaticamente baseado nas entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jasypt (Criptografia)
jasypt.encryptor.password=mySecretKey

# Cryptography Keys (AES & RSA)
crypto.aes.key=${AES_KEY:my-secret-aes-key-for-testing}
crypto.rsa.public-key=${RSA_PUBLIC_KEY:}
crypto.rsa.private-key=${RSA_PRIVATE_KEY:}
