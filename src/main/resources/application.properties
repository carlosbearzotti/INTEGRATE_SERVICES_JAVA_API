spring.application.name=integrados

# Datasource Config (Suporta PostgreSQL real via env vars ou profile -Dspring.profiles.active=postgres e fallback local H2 em arquivo com modo PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/integrados_db;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Flyway Migrations (Schema Master com tabelas reais)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=public

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (Acesse em /h2-console para inspecionar banco se não estiver no PostgreSQL)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jasypt (Criptografia)
jasypt.encryptor.password=mySecretKey

# Cryptography Keys (AES & RSA)
crypto.aes.key=${AES_KEY:my-secret-aes-key-for-testing}
crypto.rsa.public-key=${RSA_PUBLIC_KEY:}
crypto.rsa.private-key=${RSA_PRIVATE_KEY:}
