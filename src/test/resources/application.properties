# Configuração para testes
spring.application.name=integrados-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway habilitado para criar as tabelas nos testes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true

# Jasypt (Criptografia)
jasypt.encryptor.password=mySecretKey

# Cryptography Keys (AES & RSA)
crypto.aes.key=my-secret-aes-key-for-testing
